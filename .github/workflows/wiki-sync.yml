name: Wiki abgleichen

# Spiegelt den Ordner wiki/ in das GitHub-Wiki dieses Repositorys.
# Dazu kommt docs/problemprotokoll.md als Seite "Problemprotokoll" (bleibt im Repository, weil Fixes ihre
# Eintraege im selben PR ergaenzen). Quelle ist immer main: Seiten im Browser-Wiki direkt zu bearbeiten bringt nichts,
# der naechste Lauf ueberschreibt sie. Voraussetzung (einmalig im Browser): Wiki in den
# Repository-Einstellungen aktivieren und die erste Seite anlegen, sonst gibt es noch kein Wiki-Repository.

on:
  push:
    branches: [main]
    paths: ['wiki/**', 'docs/problemprotokoll.md', '.github/workflows/wiki-sync.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  wiki:
    name: Wiki / Abgleich aus wiki/
    # Nur main ist Quelle: ein manueller Start von einem anderen Branch/Tag wird uebersprungen
    if: github.ref == 'refs/heads/main'
    # Nur auf vertrauenswuerdigen, von PR-Jobs isolierten Runner-Hosts aktivieren.
    # Ein Job-Container allein bietet diese Host-Isolation nicht.
    runs-on: [self-hosted, Linux, X64, smartcity]
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - name: Ubuntu-22.04-Werkzeuge vorbereiten
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git rsync
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main                 # auch bei erneut gestartetem altem Lauf den aktuellen main-Stand nehmen
          persist-credentials: false
      - name: Wiki-Repository holen, wiki/ hineinspiegeln und pushen
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          quelle="$(git rev-parse HEAD)"     # tatsaechlich ausgecheckter Stand, nicht der Ereignis-SHA
          echo "Quelle: main @ ${quelle}"
          ziel="$(mktemp -d "$RUNNER_TEMP/wiki.XXXXXXXX")"
          trap 'rm -rf -- "$ziel"' EXIT
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" "$ziel"; then
            echo "::error::Wiki-Repository nicht erreichbar. Wiki aktivieren und im Browser die erste Seite anlegen, dann erneut starten."
            exit 1
          fi
          rsync -a --delete --exclude '.git' wiki/ "$ziel/"
          cp docs/problemprotokoll.md "$ziel/Problemprotokoll.md"
          cd "$ziel"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki ist bereits aktuell.'
            exit 0
          fi
          git commit -q -m "Wiki aus wiki/ abgeglichen (main @ ${quelle})"
          git push origin HEAD
          echo "Wiki aktualisiert: https://github.com/${REPO}/wiki"
